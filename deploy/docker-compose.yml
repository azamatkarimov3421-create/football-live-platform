version: '3.8'

services:
  # =========================================================================
  # 1. REDIS CACHE ENGINE (In-Memory Microsecond Cache & Stampede Shield)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: football-redis
    restart: always
    command: >
      redis-server 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru 
      --save 900 1 
      --save 300 10 
      --appendonly yes 
      --tcp-backlog 2048
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - football_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 2. POSTGRESQL DATABASE (User Favorites, Snapshots & Persistence)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: football-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: football_db
    command: >
      postgres 
      -c max_connections=200 
      -c shared_buffers=256MB 
      -c effective_cache_size=768MB 
      -c work_mem=16MB 
      -c maintenance_work_mem=64MB 
      -c min_wal_size=100MB 
      -c max_wal_size=1GB 
      -c checkpoint_completion_target=0.9 
      -c wal_buffers=8MB 
      -c default_statistics_target=100
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - football_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================================
  # 3. NODE.JS + FASTIFY BACKEND (Single-Flight Deduplication & REST API)
  # =========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: football-backend
    restart: always
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-YOUR_TOKEN_HERE}
      FOOTBALL_API_BASE_URL: https://api.football-data.org/v4
      UPSTREAM_TIMEOUT_MS: 8000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/football_db
      DB_POOL_MAX: 40
      RATE_LIMIT_MAX: 3000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - football_net
    expose:
      - "4000"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M

  # =========================================================================
  # 4. FRONTEND + NGINX (Reverse Proxy, Cloudflare Real-IP, Static Brotli)
  # =========================================================================
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: football-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - football_net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

volumes:
  redis_data:
  postgres_data:

networks:
  football_net:
    driver: bridge
